name: Trigger auto deployment for mediprep-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ default ]
    paths:
    - '**'
    - '.github/workflows/mediprep-app-AutoDeployTrigger-1b5e3adf-9425-4494-9491-8e1d4515be6c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.MEDIPREPAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MEDIPREPAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MEDIPREPAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.MEDIPREPAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MEDIPREPAPP_REGISTRY_PASSWORD }}
          containerAppName: mediprep-app
          resourceGroup: mediprep
          imageToBuild: donkennie/mediprep-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


